route:
  receiver: webhook_receiver
  # Специально настроили минимальные значения, чтобы тестировать работу alertmanager в devcontainer

  # Подождать перед первой отправкой
  group_wait: 5s
  # Минимальный интервал между уведомлениями одной группы
  group_interval: 10s
  # Повторять уведомление об активном алерте каждые 30 секунд
  repeat_interval: 30s

receivers:
  - name: webhook_receiver
    webhook_configs:
     # URL нашего erlang-applicaation = http://sip-alerts:8080/webhook
     # Для тестов в качестве принимающего URL можно использовать сервис https://webhook.site/ (тестовый URL будет выдан на сайте, может понадобиться регистрация)
      - url: http://sip-alerts:8080/webhook
        send_resolved: false